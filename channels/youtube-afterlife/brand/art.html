<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(Anton-Regular.ttf)}
html,body{margin:0;background:#000}svg{display:block}
</style></head><body><div id="s"></div><script>
// YoutubeAfterLife brand art. ?mode=avatar (800x800) or banner (2560x1440).
// Look: a glowing tombstone with a play button carved in it and a halo over it, at night, with a little ghost.
const MODE = new URLSearchParams(location.search).get('mode') || 'avatar';
const defs = `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0f3a"/><stop offset=".6" stop-color="#2a1458"/><stop offset="1" stop-color="#0b0618"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dbe6"/><stop offset=".5" stop-color="#9a9db0"/><stop offset="1" stop-color="#4c4e60"/></linearGradient>
  <linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3c4c"/><stop offset="1" stop-color="#22232e"/></linearGradient>
  <linearGradient id="carve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a5a"/><stop offset="1" stop-color="#a8102a"/></linearGradient>
  <radialGradient id="halo" r="50%"><stop offset=".55" stop-color="#ffd86a" stop-opacity="0"/><stop offset=".72" stop-color="#ffe9a0" stop-opacity=".9"/><stop offset=".85" stop-color="#ffb830" stop-opacity=".4"/><stop offset="1" stop-color="#ff9a00" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow" r="50%"><stop offset="0" stop-color="#b48cff" stop-opacity=".55"/><stop offset="1" stop-color="#5a2aff" stop-opacity="0"/></radialGradient>
  <radialGradient id="moon" cx="40%" cy="40%" r="60%"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#d8cfae"/></radialGradient>
  <radialGradient id="ghost" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e4e0ff"/><stop offset="1" stop-color="#a9a2e0"/></radialGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a2a"/><stop offset="1" stop-color="#08140e"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="fog"><feTurbulence type="fractalNoise" baseFrequency=".004 .02" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .8  0 0 0 0 .75  0 0 0 0 1  0 0 0 .55 -.12"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".6"/></filter>
</defs>`;

// tombstone with a carved play button. text: optional engraving under it.
function stone(x, y, s, text, haloOn = true) {
  return `<g transform="translate(${x},${y}) scale(${s})">
    <circle cy="-40" r="330" fill="url(#glow)"/>
    <path d="M150 -150 Q150 -300 0 -300 L30 -300 Q190 -300 190 -150 L190 260 L150 260Z" fill="url(#stoneSide)"/>
    <path d="M-150 260 L-150 -150 Q-150 -300 0 -300 Q150 -300 150 -150 L150 260Z" fill="url(#stone)" filter="url(#shadow)"/>
    <path d="M-150 -150 Q-150 -300 0 -300 Q150 -300 150 -150" fill="none" stroke="#fff" stroke-width="6" opacity=".45"/>
    <path d="M-60 -110 l30 40 M80 120 l-20 50 l14 30" stroke="#55576a" stroke-width="5" fill="none" opacity=".7"/>
    <path d="M-44 -150 L66 -86 L-44 -22Z" fill="#3a3c4c" stroke="#2a2b36" stroke-width="10" stroke-linejoin="round"/>
    <path d="M-36 -136 L50 -86 L-36 -36Z" fill="url(#carve)"/>
    <path d="M-36 -136 L50 -86" stroke="#ffb0b8" stroke-width="4" opacity=".7"/>
    ${text ? `<text y="60" text-anchor="middle" font-family="Anton" font-size="50" fill="#3a3c4c" letter-spacing="2">${text}</text>
      <text y="120" text-anchor="middle" font-family="Anton" font-size="34" fill="#4a4c5e" letter-spacing="3">2009 – 2019</text>` : ''}
    <path d="M-210 260 Q0 220 210 260 L230 300 L-230 300Z" fill="url(#grass)"/>
    ${haloOn ? `<ellipse cy="-360" rx="150" ry="40" fill="none" stroke="#ffe08a" stroke-width="22" style="filter:drop-shadow(0 0 18px #ffb830)"/>
      <ellipse cy="-360" rx="150" ry="40" fill="none" stroke="#fff6cf" stroke-width="7"/>` : ''}
  </g>`;
}
// small friendly ghost holding a tiny camera
function ghost(x, y, s, flip = 1) {
  return `<g transform="translate(${x},${y}) scale(${s * flip},${s})">
    <path d="M-90 40 Q-100 -150 0 -150 Q100 -150 90 40 L90 120 Q70 100 50 125 Q30 100 10 125 Q-10 100 -30 125 Q-50 100 -70 125 Q-85 105 -90 120Z" fill="url(#ghost)" style="filter:drop-shadow(0 0 20px rgba(200,180,255,.7))"/>
    <ellipse cx="-34" cy="-50" rx="16" ry="22" fill="#1a1030"/><ellipse cx="34" cy="-50" rx="16" ry="22" fill="#1a1030"/>
    <circle cx="-28" cy="-58" r="6" fill="#fff"/><circle cx="40" cy="-58" r="6" fill="#fff"/>
    <path d="M-18 -6 Q0 8 18 -6" stroke="#1a1030" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g transform="translate(70,30) rotate(-12)"><rect x="-40" y="-28" width="80" height="56" rx="10" fill="#26263a"/><circle r="18" fill="#0e0e1a" stroke="#6a6aa0" stroke-width="5"/><circle cx="26" cy="-18" r="6" fill="#ff3a4a"/></g>
  </g>`;
}
const stars = (w, h, n) => [...Array(n)].map((_, i) => `<circle cx="${(i * 733) % w}" cy="${(i * 397) % (h * 0.6)}" r="${1 + i % 3}" fill="#fff" opacity="${0.3 + (i % 5) / 8}"/>`).join('');
const vignette = (w, h) => `<radialGradient id="vig" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient><rect width="${w}" height="${h}" fill="url(#vig)"/>`;

let svg;
if (MODE === 'avatar') {
  const W = 800;
  svg = `<svg width="${W}" height="${W}" viewBox="0 0 ${W} ${W}">${defs}
    <rect width="${W}" height="${W}" fill="url(#sky)"/>${stars(W, W, 40)}
    <circle cx="610" cy="170" r="70" fill="url(#moon)" opacity=".9"/>
    <rect width="${W}" height="${W}" filter="url(#fog)" opacity=".5"/>
    <path d="M0 690 Q400 620 800 690 V800 H0Z" fill="url(#grass)"/>
    ${stone(400, 470, 1.05, '', true)}
    ${ghost(150, 520, .9)}
    ${vignette(W, W)}
  </svg>`;
} else {
  const W = 2560, H = 1440;  // TVs show it all; desktop shows the strip y 508-931; phones only x 507-2053 of that strip
  svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${defs}
    <rect width="${W}" height="${H}" fill="url(#sky)"/>${stars(W, H, 140)}
    <circle cx="2150" cy="330" r="150" fill="url(#moon)"/><circle cx="2150" cy="330" r="300" fill="#fff6d0" opacity=".08" filter="url(#soft)"/>
    <path d="M0 1050 Q600 940 1280 1000 Q1900 940 2560 1040 V1440 H0Z" fill="url(#grass)"/>
    <rect width="${W}" height="${H}" filter="url(#fog)" opacity=".55"/>
    ${stone(300, 900, .62, 'R.I.P.', false)}
    ${stone(2260, 900, .62, 'ON HIATUS', false)}
    ${ghost(460, 560, .75)}${ghost(2110, 600, .65, -1)}
    <g transform="translate(1280,640)">
      <ellipse cy="-40" rx="270" ry="46" fill="none" stroke="#ffe08a" stroke-width="16" style="filter:drop-shadow(0 0 22px #ffb830)"/>
      <ellipse cy="-40" rx="270" ry="46" fill="none" stroke="#fff6cf" stroke-width="5"/>
    </g>
    <text x="1280" y="760" text-anchor="middle" font-family="Anton" font-size="170" fill="#fff" letter-spacing="6" style="filter:drop-shadow(0 8px 0 #000) drop-shadow(0 0 30px rgba(180,140,255,.6))">YOUTUBE <tspan fill="#ff3a4a">AFTERLIFE</tspan></text>
    <text x="1280" y="850" text-anchor="middle" font-family="Anton" font-size="54" fill="#d8d0ff" letter-spacing="5">WHERE DID YOUR FAVOURITE YOUTUBERS GO?</text>
    <text x="1280" y="910" text-anchor="middle" font-family="Anton" font-size="38" fill="#ffd86a" letter-spacing="4">ANIMATED STORIES OF WHY THEY FELL OFF</text>
    ${vignette(W, H)}
  </svg>`;
}
document.getElementById('s').innerHTML = svg;
window.ready = document.fonts.ready.then(() => true);
</script></body></html>
