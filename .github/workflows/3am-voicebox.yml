name: 3 AM Stories voice (voicebox, free)
on:
  workflow_dispatch:
    inputs:
      story: { description: "story folder, e.g. channels/3am-stories/stories/037-third-camera", required: true }
permissions: { contents: write }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install voicebox engines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts "kokoro>=0.9.4" "misaki[en]" soundfile requests
      - name: Voice
        run: VOICE_ONLY=1 python3 channels/3am-stories/engine/build.py "${{ github.event.inputs.story }}"
      - name: Keep the voice takes
        run: |
          git config user.name "3am-bot" && git config user.email "3am-bot@users.noreply.github.com"
          git add "${{ github.event.inputs.story }}/voice" && git commit -m "3 AM Stories voicebox voice: $(basename ${{ github.event.inputs.story }})" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
