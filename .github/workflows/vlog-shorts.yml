name: Vlog shorts
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Vlog id (folder under vlog/ holding shorts.json)'
        required: true
      urls:
        description: 'Space-separated NAME|URL pairs (Zapier-hydrated Drive files) for the raw clips'
        required: true
      only:
        description: 'Optional space-separated slugs to render (default: all)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install faster-whisper requests gdown
          mkdir -p ~/.fonts && cp vlog/fonts/*.ttf ~/.fonts/ && fc-cache -f
      - name: Download raw footage
        env:
          VLOG_KEY: ${{ secrets.VLOG_KEY }}
        run: |
          vlog/unlock.sh
          # read the links from the event file (not the step env) and mask them, so public logs never show them
          URLS=$(jq -r '.inputs.urls' "$GITHUB_EVENT_PATH")
          for p in $URLS; do echo "::add-mask::${p#*|}"; done
          vlog/fetch_clips.sh vlog/${{ github.event.inputs.name }} "$URLS"
      - name: Render shorts
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          D=vlog/${{ github.event.inputs.name }}
          python3 vlog/shorts.py $D $ONLY
          mkdir -p $D/review
          for f in $D/shorts/*.mp4; do ffmpeg -v error -y -i "$f" -vf "fps=1/2,scale=216:-1,tile=8x1" -frames:v 1 "$D/review/short-$(basename $f .mp4).jpg"; done
          cp $D/shorts/titles.txt $D/review/ 2>/dev/null || true
          rm -rf raw
      - name: Upload to Drive (Vlog Edits/<id> Shorts)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -o pipefail; D=vlog/${{ github.event.inputs.name }}
          for f in $D/shorts/*.mp4; do python3 vlog/drive_put.py "$f" "$(basename $f)" "${{ github.event.inputs.name }} Shorts" || exit 1; done | tee $D/review/shorts-drive.txt
      - name: Commit sealed review
        run: |
          D=vlog/${{ github.event.inputs.name }}; mkdir -p $D/sealed
          vlog/seal.sh $D/review $D/sealed/${{ github.run_id }}-shorts
          git config user.name "vlog-bot" && git config user.email "vlog-bot@users.noreply.github.com"
          git add $D/sealed
          git commit -m "Vlog shorts review (sealed): ${{ github.event.inputs.name }}" && git pull --rebase && git push
