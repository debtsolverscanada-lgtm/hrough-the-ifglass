name: Vlog thumbnails
on:
  workflow_dispatch:
    inputs:
      folders:
        description: 'Space-separated public Google Drive folder URLs with the raw clips'
        required: true
      name:
        description: 'Vlog id (folder under vlog/ holding thumb.json)'
        required: true
      urls:
        description: 'Optional space-separated NAME|URL pairs (e.g. Zapier-hydrated Drive files); bypasses the public-link download limit'
        required: false
        default: ''
      files:
        description: 'Optional space-separated Drive file IDs: download only these clips instead of whole folders'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install gdown "rembg[cpu]" pillow
          npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Download raw footage
        run: |
          if [ -n "${{ github.event.inputs.urls }}" ]; then mkdir -p raw && cd raw && for p in ${{ github.event.inputs.urls }}; do n="${p%%|*}"; u="${p#*|}"; curl -sSL --retry 3 -o "$n" "$u"; done; ls -la; file * | head;
          elif [ -n "${{ github.event.inputs.files }}" ]; then mkdir -p raw && cd raw && for id in ${{ github.event.inputs.files }}; do for t in 1 2 3; do gdown -q "$id" && break; sleep 15; done; done; ls -la; else vlog/fetch.sh ${{ github.event.inputs.folders }}; fi
      - name: Build thumbnails
        run: python3 vlog/thumb/make.py "vlog/${{ github.event.inputs.name }}"
      - name: Commit
        run: |
          git config user.name "vlog-bot" && git config user.email "vlog-bot@users.noreply.github.com"
          git add vlog/${{ github.event.inputs.name }}/thumb-*.jpg
          git commit -m "Vlog thumbnails: ${{ github.event.inputs.name }}" && git pull --rebase && git push
