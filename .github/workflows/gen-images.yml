name: Generate story art
on:
  workflow_dispatch:
    inputs:
      prompts:
        description: 'Path to prompts.json in the repo'
        required: true
      out:
        description: 'Output folder in the repo'
        required: true
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -u channels/3am-stories/engine/gen_images.py "${{ github.event.inputs.prompts }}" "${{ github.event.inputs.out }}"
      - name: Commit art
        if: always()
        run: |
          git config user.name "3am-bot" && git config user.email "3am-bot@users.noreply.github.com"
          git add "${{ github.event.inputs.out }}" && git commit -m "Story art: ${{ github.event.inputs.out }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
