name: 3 AM Stories build
on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Story folder, e.g. channels/3am-stories/stories/001-bathroom'
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
          npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          pip install requests
          mkdir -p ~/.fonts && cp channels/3am-stories/engine/PermanentMarker-Regular.ttf ~/.fonts/ && fc-cache -f
      - name: Build
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 channels/3am-stories/engine/build.py "${{ github.event.inputs.story }}" --workers 4
      - name: Keep the voice takes (no credits spent on re-renders)
        run: |
          git config user.name "3am-bot" && git config user.email "3am-bot@users.noreply.github.com"
          git add "${{ github.event.inputs.story }}/voice" && git commit -m "3 AM Stories voice: $(basename ${{ github.event.inputs.story }})" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
      - name: Upload to Drive (Vlog Edits/3AM Stories)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -o pipefail; S="${{ github.event.inputs.story }}"; N=$(basename $S)
          python3 vlog/drive_put.py "$S/out/video.mp4" "$N.mp4" "3AM Stories" || exit 1
          python3 vlog/drive_put.py "$S/out/thumb.jpg" "$N-thumb.jpg" "3AM Stories" || exit 1
