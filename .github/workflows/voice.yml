name: Voice a script (ElevenLabs)
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script file, e.g. ideas/xray-vision/022-xray-vision-VOICEOVER.txt'
        required: true
      out:
        description: 'Where to save the MP3, e.g. ideas/xray-vision/022-xray-vision.mp3'
        required: true
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg && pip install requests
          python3 pipeline/tts.py "${{ github.event.inputs.script }}" "${{ github.event.inputs.out }}"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "${{ github.event.inputs.out }}"
      - name: Commit the MP3
        run: |
          git config user.name "ifglass-bot" && git config user.email "ifglass-bot@users.noreply.github.com"
          git add "${{ github.event.inputs.out }}" && git commit -m "Voiceover: ${{ github.event.inputs.out }} (ElevenLabs)" && for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
