name: Vlog probe
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Vlog id (folder under vlog/)'
        required: true
      urls:
        description: 'Space-separated NAME|URL pairs (Zapier-hydrated Drive files)'
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq && pip install gdown requests
      - name: Download and inspect clips (timing only; no picture or sound leaves the runner)
        env:
          VLOG_KEY: ${{ secrets.VLOG_KEY }}
        run: |
          vlog/unlock.sh
          URLS=$(jq -r '.inputs.urls' "$GITHUB_EVENT_PATH")
          for p in $URLS; do echo "::add-mask::${p#*|}"; done
          vlog/fetch_clips.sh vlog/${{ github.event.inputs.name }} "$URLS"
          for f in raw/*; do
            echo "===== $f"
            ffprobe -v error -show_entries format=duration,start_time:format_tags=major_brand,compatible_brands,encoder,com.apple.quicktime.make,com.apple.quicktime.model:stream=index,codec_type,codec_name,r_frame_rate,avg_frame_rate,start_time,duration,nb_frames,sample_rate,time_base:stream_side_data=rotation -of compact "$f"
            ffprobe -v error -select_streams v:0 -show_entries packet=pts_time -of csv=p=0 "$f" | sort -n | awk 'NR>1{d=$1-p; if(d<mn||NR==2)mn=d; if(d>mx)mx=d; s+=d; n++} {p=$1} END{printf "video frames %d, frame gap min %.4f max %.4f mean %.4f (VFR if min and max differ a lot)\n", n+1, mn, mx, s/n}'
            ffprobe -v error -select_streams a:0 -show_entries packet=pts_time,duration_time -of csv=p=0 "$f" | awk -F, 'NR==1{f=$1} {l=$1+$2} END{printf "audio packets span %.3f to %.3f\n", f, l}'
          done
