name: Style study
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Study name (folder under study/)'
        required: true
      urls:
        description: 'Space-separated NAME|URL pairs (Zapier-hydrated Drive files of videos you saved yourself)'
        required: true
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q -U faster-whisper numpy
      # Private study only: the videos and frames never leave the runner unencrypted (sealed below), and nothing is re-published.
      - name: Download and measure
        run: |
          mkdir -p vids res
          URLS=$(jq -r '.inputs.urls' "$GITHUB_EVENT_PATH")
          for p in $URLS; do echo "::add-mask::${p#*|}"; done
          for p in $URLS; do
            n=${p%%|*}; n=${n%.*}
            if curl -sfL -o "vids/$n.mp4" "${p#*|}"; then
              python3 study/measure.py "vids/$n.mp4" "res/$n" || echo "MEASURE FAILED $n"
            else echo "DOWNLOAD FAILED $n"; fi
          done
          ls res
      - name: Commit sealed results
        run: |
          D=study/${{ github.event.inputs.name }}; mkdir -p $D
          vlog/seal.sh res $D/${{ github.run_id }}
          git config user.name "study-bot" && git config user.email "study-bot@users.noreply.github.com"
          git add $D && git commit -m "Style study (sealed): ${{ github.event.inputs.name }}" && git pull --rebase --autostash && git push
