name: Style study
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Study name (folder under study/)'
        required: true
      ids:
        description: 'Space-separated YouTube video ids'
        required: true
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q -U yt-dlp faster-whisper numpy
      # Private study only: the videos and frames never leave the runner unencrypted (sealed below), and nothing is re-published.
      - name: Download and measure
        run: |
          mkdir -p vids res
          for id in ${{ github.event.inputs.ids }}; do
            if yt-dlp -q --no-warnings -f 'bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]' --merge-output-format mp4 -o "vids/$id.mp4" "https://www.youtube.com/watch?v=$id"; then
              python3 study/measure.py "vids/$id.mp4" "res/$id" || echo "MEASURE FAILED $id"
            else echo "DOWNLOAD FAILED $id"; fi
          done
          ls res
      - name: Commit sealed results
        run: |
          D=study/${{ github.event.inputs.name }}; mkdir -p $D
          vlog/seal.sh res $D/${{ github.run_id }}
          git config user.name "study-bot" && git config user.email "study-bot@users.noreply.github.com"
          git add $D && git commit -m "Style study (sealed): ${{ github.event.inputs.name }}" && git pull --rebase --autostash && git push
