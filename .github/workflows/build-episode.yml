name: Build & queue episode
on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode folder, e.g. episodes/002-woke-up-1000-years'
        required: true
      thumb_only:
        description: 'Only replace the queued thumbnail with the committed one (no render)'
        required: false
        default: ''
      parts_only:
        description: 'Only render + queue the vertical Part series (episode already posted/queued)'
        required: false
        default: ''
      video_only:
        description: 'Only re-render the main video and re-upload it into its existing queue row (file was deleted)'
        required: false
        default: ''
      test_seconds:
        description: 'Test only: render just the first N seconds and do NOT queue it for posting'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['episodes/*/READY']   # commit an empty READY file in an episode folder to build it
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pick episode
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then echo "dir=${{ github.event.inputs.episode }}" >> $GITHUB_OUTPUT;
          else D=$(git diff --name-only --diff-filter=A HEAD~1 HEAD | grep '/READY$' | head -1 | xargs -r dirname); [ -n "$D" ] || { echo "no new READY file"; exit 1; }; echo "dir=$D" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
          npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          pip install pocketsphinx requests
      - name: Voice with ElevenLabs (only if the episode has no recording)
        if: ${{ !github.event.inputs.thumb_only }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          D="${{ steps.ep.outputs.dir }}"; V="$D/$(jq -r .voice "$D/meta.json")"
          if [ ! -f "$V" ]; then
            python3 pipeline/tts.py "$D"
            git config user.name "ifglass-bot" && git config user.email "ifglass-bot@users.noreply.github.com"
            git add "$V" && git commit -m "Voiceover for $(basename $D) (ElevenLabs)" && git pull --rebase --autostash && git push
          fi
      - name: Build video, thumbnail, clips
        if: ${{ !github.event.inputs.thumb_only }}
        run: |
          if [ -n "${{ github.event.inputs.test_seconds }}" ]; then EXTRA="--seconds ${{ github.event.inputs.test_seconds }}"; fi
          if [ -n "${{ github.event.inputs.parts_only }}" ]; then EXTRA="$EXTRA --parts-only"; fi
          if [ -n "${{ github.event.inputs.video_only }}" ]; then EXTRA="$EXTRA --no-clips"; fi
          python3 pipeline/build.py "${{ steps.ep.outputs.dir }}" --workers 4 $EXTRA
      - name: Upload to Drive & queue
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.test_seconds }}" ]; then EXTRA="--test"; fi
          if [ -n "${{ github.event.inputs.parts_only }}" ]; then EXTRA="$EXTRA --parts-only"; fi
          if [ -n "${{ github.event.inputs.thumb_only }}" ]; then EXTRA="$EXTRA --thumb-only"; fi
          if [ -n "${{ github.event.inputs.video_only }}" ]; then EXTRA="$EXTRA --video-only"; fi
          python3 pipeline/drive_upload.py "${{ steps.ep.outputs.dir }}" $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: output, path: build/*/out/*.mp4, retention-days: 7 }
