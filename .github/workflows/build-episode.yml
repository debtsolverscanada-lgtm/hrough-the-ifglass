name: Build & queue episode
on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode folder, e.g. episodes/002-woke-up-1000-years'
        required: true
  push:
    branches: [main]
    paths: ['episodes/*/READY']   # commit an empty READY file in an episode folder to build it
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Pick episode
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then echo "dir=${{ github.event.inputs.episode }}" >> $GITHUB_OUTPUT;
          else echo "dir=$(git diff --name-only HEAD~1 HEAD | grep '/READY$' | head -1 | xargs dirname)" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
          npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          pip install pocketsphinx requests
      - name: Build video, thumbnail, clips
        run: python3 pipeline/build.py "${{ steps.ep.outputs.dir }}" --workers 4
      - name: Upload to Drive & queue
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python3 pipeline/drive_upload.py "${{ steps.ep.outputs.dir }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: output, path: build/*/out/*.mp4, retention-days: 7 }
