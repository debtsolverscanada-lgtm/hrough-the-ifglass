<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Marker; src: url(../fonts/PermanentMarker-Regular.ttf); }
@font-face { font-family: Anton; src: url(../fonts/Anton-Regular.ttf); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
<script src="d3-array.min.js"></script>
<script src="d3-geo.min.js"></script>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Animated flight-path transition: Toronto (Billy Bishop) -> New York City.
// render(t) draws one frame at time t seconds; map.js steps it frame by frame.
const W = 1920, H = 1080, DUR = 4.2;
const YTZ = [-79.396, 43.628], NYC = [-74.006, 40.713];
const CTRL = [-77.2, 43.9];  // bend the route into an arc
const OCEAN = '#a8cde6', LAND = '#f6efdf', EDGE = '#d9c9a6', ROUTE = '#ff3b5c', INK = '#1d1d1f';
const ctx = document.getElementById('c').getContext('2d');
let GEO = null;

const ease = x => x < 0 ? 0 : x > 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = x => Math.max(0, Math.min(1, x));
const lerp = (a, b, k) => a + (b - a) * k;
const pop = (t, at) => { const k = clamp((t - at) / 0.35); return k === 0 ? 0 : 1 + 0.25 * Math.sin(k * Math.PI) * (1 - k) + (k < 1 ? -(1 - k) * (1 - k) : 0); };

function route(k) {  // quadratic bezier in lon/lat
  const a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
  return [a * YTZ[0] + b * CTRL[0] + c * NYC[0], a * YTZ[1] + b * CTRL[1] + c * NYC[1]];
}

function camera(t) {  // centre + scale over time
  const mid = route(0.5);
  const k1 = ease((t - 0.35) / 1.4), k2 = ease((t - 2.2) / 1.6);
  const c1 = [lerp(YTZ[0], mid[0], k1), lerp(YTZ[1], mid[1], k1)];
  const c = [lerp(c1[0], NYC[0], k2), lerp(c1[1], NYC[1], k2)];
  const s = lerp(lerp(6800, 3700, k1), 7200, k2) * (1 + 0.04 * t);  // slow push-in throughout
  return d3.geoMercator().center(c).scale(s).translate([W / 2, H / 2]);
}

function plane(x, y, ang, size) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(size / 100, size / 100);
  const p = new Path2D('M50 0 L58 6 L58 34 L100 58 L100 68 L58 54 L56 82 L70 94 L70 100 L50 94 L30 100 L30 94 L44 82 L42 54 L0 68 L0 58 L42 34 L42 6 Z');
  ctx.translate(-50, -50);
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#fff'; ctx.fill(p); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke(p);
  ctx.restore();
}

function pin(x, y, s) {
  if (s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 6;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-26, -34, -30, -52, -30, -62);
  ctx.arc(0, -62, 30, Math.PI, 0); ctx.bezierCurveTo(30, -52, 26, -34, 0, 0);
  ctx.fillStyle = ROUTE; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -62, 11, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
}

function sticker(x, y, text, s, rot, bg) {  // marker-font label on a tilted sticker
  if (s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.font = '76px Marker'; const w = ctx.measureText(text).width + 64, h = 110;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 10;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 18); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 6);
  ctx.restore();
}

function render(t) {
  const proj = camera(t), path = d3.geoPath(proj, ctx);
  ctx.fillStyle = OCEAN; ctx.fillRect(0, 0, W, H);
  // land with a soft paper shadow, then lakes, then state/province lines
  ctx.save(); ctx.shadowColor = 'rgba(30,60,90,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  ctx.beginPath(); path(GEO.land); ctx.fillStyle = LAND; ctx.fill(); ctx.restore();
  ctx.beginPath(); path(GEO.land); ctx.lineWidth = 3; ctx.strokeStyle = EDGE; ctx.stroke();
  ctx.beginPath(); path(GEO.lakes); ctx.fillStyle = OCEAN; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#8fb9d6'; ctx.stroke();
  ctx.save(); ctx.setLineDash([10, 12]); ctx.beginPath(); path(GEO.borders); ctx.lineWidth = 2.5; ctx.strokeStyle = EDGE; ctx.stroke(); ctx.restore();

  // route draws on, plane rides its tip
  const k = ease((t - 0.55) / 2.4);
  const pts = d3.range(0, 1.0001, 1 / 200).filter(u => u <= k).map(u => proj(route(u)));
  if (pts.length > 1) {
    ctx.save(); ctx.setLineDash([26, 18]); ctx.lineCap = 'round';
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.lineWidth = 16; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.lineWidth = 9; ctx.strokeStyle = ROUTE; ctx.stroke(); ctx.restore();
  }
  const [ax, ay] = proj(YTZ), [bx, by] = proj(NYC);
  pin(ax, ay, pop(t, 0.15)); pin(bx, by, pop(t, 2.85));
  if (k > 0 && k < 1) {
    const [px, py] = proj(route(k)), [qx, qy] = proj(route(Math.min(1, k + 0.01)));
    plane(px, py, Math.atan2(qy - py, qx - px) + Math.PI / 2, 120 + 40 * Math.sin(k * Math.PI));
  }
  sticker(ax, ay - 160, 'TORONTO', pop(t, 0.3) * (1 - clamp((t - 1.6) / 0.3)), -0.06, '#fff');
  sticker(bx, by - 165, 'NEW YORK CITY', pop(t, 3.0), 0.05, '#ffd84d');

  // title strip + fade from/to white for the cut
  ctx.font = '54px Anton'; ctx.fillStyle = 'rgba(29,29,31,.85)'; ctx.textAlign = 'left';
  ctx.fillText('YTZ  →  NYC', 70, 110);
  const wa = Math.max(1 - t / 0.2, (t - (DUR - 0.12)) / 0.12);
  if (wa > 0) { ctx.fillStyle = `rgba(255,255,255,${clamp(wa)})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = fetch('region.json').then(r => r.json()).then(g => { GEO = g; return document.fonts.load('76px Marker'); })
  .then(() => document.fonts.load('54px Anton')).then(() => true);
window.frame = t => { render(t); return document.getElementById('c').toDataURL('image/png'); };
window.DUR = DUR;
</script>
</body></html>
