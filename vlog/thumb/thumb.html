<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@700&family=Instrument+Serif:ital@0;1&family=Inter:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#111}
.v{position:absolute;inset:0;display:none}
body[data-v=A] #A, body[data-v=B] #B{display:block}
/* ---------- A: chaos (cut-outs over bright NYC) ---------- */
#A .bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:saturate(1.35) contrast(1.08) brightness(1.05) blur(1.5px)}
#A .tint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(0,0,0,.45) 100%)}
#A .cut{position:absolute;bottom:-10px;filter:drop-shadow(0 0 0 #fff) drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff) drop-shadow(0 14px 18px rgba(0,0,0,.55))}
#A .title{position:absolute;left:44px;top:26px;font:120px/1 'Permanent Marker';color:#fff;transform:rotate(-5deg);
  text-shadow:0 6px 0 #111,0 0 22px rgba(0,0,0,.35);-webkit-text-stroke:3px #111;letter-spacing:2px}
#A .sticker{position:absolute;right:40px;top:40px;background:#FFD400;color:#111;font:800 38px/1 Inter;padding:14px 22px;border-radius:14px;
  transform:rotate(6deg);box-shadow:0 8px 0 #111;border:4px solid #111}
#A .arrow{position:absolute;width:150px;height:110px}
/* ---------- B: aesthetic collage ---------- */
#B{background:#F4EDE2}
#B .ph{position:absolute;background-size:cover;background-position:center;border:12px solid #fff;border-bottom-width:44px;box-shadow:0 18px 40px rgba(60,40,20,.35);filter:sepia(.18) saturate(1.1) contrast(1.05) brightness(1.04)}
#B .grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
#B .t1{position:absolute;font:italic 168px/0.9 'Instrument Serif';color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.4)}
#B .t2{position:absolute;font:700 76px/1 Caveat;color:#FFD84D;text-shadow:0 0 3px #3a2a10,0 3px 14px rgba(0,0,0,.75);transform:rotate(-4deg)}
#B .tape{position:absolute;width:120px;height:34px;background:rgba(255,236,170,.75);transform:rotate(-8deg)}
</style></head>
<body data-v="A">
<div id="A" class="v">
  <div class="bg" id="Abg"></div><div class="tint"></div>
  <div id="Acuts"></div>
  <div class="title" id="Atitle">hi kids</div>
  <div class="sticker" id="Asticker">NYC</div>
</div>
<div id="B" class="v">
  <div id="Bphotos"></div>
  <div class="t1" id="Bt1">new york</div>
  <div class="t2" id="Bt2">with the kids ↘</div>
  <div class="grain"></div>
</div>
<script>
// window.CFG = {v:'A'|'B', A:{bg, cuts:[{src,x,h}], title, sticker}, B:{photos:[{src,x,y,w,h,rot}], t1:{text,x,y}, t2:{text,x,y}}}
function build(c){
  document.body.dataset.v=c.v;
  if(c.A){const a=c.A;Abg.style.backgroundImage=`url(${a.bg})`;Atitle.textContent=a.title||'hi kids';
    if(a.sticker===null)Asticker.remove();else if(a.sticker)Asticker.textContent=a.sticker;
    Acuts.innerHTML=(a.cuts||[]).map(k=>`<img class="cut" src="${k.src}" style="left:${k.x}px;height:${k.h}px">`).join('');}
  if(c.B){const b=c.B;
    Bphotos.innerHTML=b.photos.map(p=>`<div class="ph" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;transform:rotate(${p.rot||0}deg);background-image:url(${p.src})"></div>`+(p.tape?`<div class="tape" style="left:${p.x+p.w/2-60}px;top:${p.y-14}px"></div>`:'')).join('');
    Object.assign(Bt1.style,{left:b.t1.x+'px',top:b.t1.y+'px'});Bt1.textContent=b.t1.text;
    Object.assign(Bt2.style,{left:b.t2.x+'px',top:b.t2.y+'px'});Bt2.textContent=b.t2.text;}
}
if(window.CFG)build(window.CFG);
</script></body></html>
