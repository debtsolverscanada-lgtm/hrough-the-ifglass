<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}svg{display:block}text{font-family:"Inter Display","Inter",sans-serif}</style></head><body><div id="s"></div>
<script src="../../studio/lib.js"></script><script src="../../studio/thumbkit.js"></script><script>
// Nov 25 style: centred tight close-up, terrified face split-lit red / sickly green, shambling silhouettes behind, 2 words.
const K='#050A07', RED='#FF2E3A', GRN='#7CFF4A';
const r=rng(27);
// shambling silhouettes with glowing eyes
function sil(x,y,s,lean,arm){return `<g transform="translate(${x},${y}) scale(${s}) rotate(${lean})" fill="#0B140E">
 <circle cx="0" cy="-250" r="78"/><path d="M-70 -170 Q0 -195 70 -170 L90 120 Q0 140 -90 120Z"/>
 <path d="M-60 -150 Q${60+arm} -120 ${170+arm} -110" stroke="#0B140E" stroke-width="46" stroke-linecap="round" fill="none"/>
 <path d="M60 -150 Q${120+arm} -80 ${200+arm} -60" stroke="#0B140E" stroke-width="46" stroke-linecap="round" fill="none"/>
 <path d="M-40 110 L-60 380 M40 110 L70 380" stroke="#0B140E" stroke-width="56" stroke-linecap="round"/>
 <circle cx="-26" cy="-258" r="13" fill="${GRN}"/><circle cx="26" cy="-258" r="13" fill="${GRN}"/>
 <circle cx="-26" cy="-258" r="34" fill="${GRN}" opacity=".25"/><circle cx="26" cy="-258" r="34" fill="${GRN}" opacity=".25"/></g>`;}
let crowd='';
[[140,760,1.05,-6,10],[360,700,.85,4,-20],[560,780,1.0,-3,0],[1360,780,1.0,5,-10],[1560,700,.85,-5,20],[1790,760,1.05,6,0],[260,560,.6,3,0],[1660,560,.6,-3,0],[470,520,.5,-4,0],[1450,520,.5,4,0]]
 .sort((a,b)=>a[2]-b[2]).forEach(([x,y,s,l,a],i)=>crowd+=sil(x,y,s,l,(i%2?1:-1)*a));
// terrified face (Glint: gold round glasses, mint scarf)
const skin='#F6E7CF';
const face=`<g transform="translate(960,690)">
 <path d="M-430 440 Q-400 230 -180 200 L180 200 Q400 230 430 440Z" fill="#2A3A4A" stroke="${K}" stroke-width="14"/>
 <path d="M-210 190 Q0 260 210 190 L220 260 Q0 330 -220 260Z" fill="#3DF5C2" stroke="${K}" stroke-width="12"/>
 <ellipse cx="0" cy="-60" rx="320" ry="330" fill="${skin}" stroke="${K}" stroke-width="14"/>
 <clipPath id="fc"><ellipse cx="0" cy="-60" rx="313" ry="323"/></clipPath>
 <g clip-path="url(#fc)"><rect x="-340" y="-400" width="340" height="700" fill="${RED}" opacity=".45"/><rect x="0" y="-400" width="340" height="700" fill="${GRN}" opacity=".40"/>
  <rect x="-340" y="-400" width="80" height="700" fill="#7A0010" opacity=".35"/><rect x="260" y="-400" width="80" height="700" fill="#1A5A10" opacity=".35"/></g>
 <path d="M-300 -150 Q-300 -400 0 -400 Q300 -400 300 -150 Q260 -300 120 -310 Q20 -260 -60 -320 Q-220 -300 -300 -150Z" fill="#2A1A12" stroke="${K}" stroke-width="14" stroke-linejoin="round"/>
 <path d="M-250 -230 Q-150 -360 0 -370" stroke="${RED}" stroke-width="14" fill="none" stroke-linecap="round" opacity=".8"/><path d="M90 -360 Q220 -330 270 -220" stroke="${GRN}" stroke-width="14" fill="none" stroke-linecap="round" opacity=".8"/>
 <!-- eyes wide with tiny pupils -->
 <ellipse cx="-125" cy="-60" rx="92" ry="104" fill="#fff" stroke="${K}" stroke-width="12"/><ellipse cx="125" cy="-60" rx="92" ry="104" fill="#fff" stroke="${K}" stroke-width="12"/>
 <circle cx="-112" cy="-50" r="20" fill="${K}"/><circle cx="138" cy="-50" r="20" fill="${K}"/><circle cx="-104" cy="-58" r="7" fill="#fff"/><circle cx="146" cy="-58" r="7" fill="#fff"/>
 <circle cx="-125" cy="-60" r="118" fill="none" stroke="${K}" stroke-width="30"/><circle cx="125" cy="-60" r="118" fill="none" stroke="${K}" stroke-width="30"/>
 <circle cx="-125" cy="-60" r="118" fill="none" stroke="#F2C14E" stroke-width="14"/><circle cx="125" cy="-60" r="118" fill="none" stroke="#F2C14E" stroke-width="14"/>
 <path d="M-12 -70 Q0 -84 12 -70" stroke="#F2C14E" stroke-width="12" fill="none"/>
 <path d="M-200 -170 Q-200 -175 -230 -150" stroke="#fff" stroke-width="10" fill="none" opacity=".7"/>
 <path d="M-230 -225 Q-140 -290 -40 -235" stroke="${K}" stroke-width="28" fill="none" stroke-linecap="round"/><path d="M40 -235 Q140 -290 230 -225" stroke="${K}" stroke-width="28" fill="none" stroke-linecap="round"/>
 <!-- screaming mouth -->
 <ellipse cx="0" cy="170" rx="80" ry="96" fill="#4A0E14" stroke="${K}" stroke-width="12"/><path d="M-62 120 Q0 100 62 120" stroke="#fff" stroke-width="12" fill="none"/><ellipse cx="0" cy="222" rx="42" ry="22" fill="#C9575A"/>
 <path d="M-250 70 Q-230 140 -170 180" stroke="${K}" stroke-width="8" fill="none" opacity=".3"/><path d="M250 70 Q230 140 170 180" stroke="${K}" stroke-width="8" fill="none" opacity=".3"/>
 <g fill="#9FD8FF" stroke="${K}" stroke-width="5"><path d="M262 -170 q16 34 0 50 q-16 -16 0 -50z"/><path d="M-280 -40 q14 30 0 44 q-14 -14 0 -44z"/></g>
</g>`;
document.getElementById('s').innerHTML=TK.wrap(`
 <rect width="1920" height="1080" fill="#06110A"/>
 ${TK.glowBlob(180,260,560,RED,.75)}${TK.glowBlob(1740,260,560,GRN,.6)}
 ${TK.rays(180,80,RED,12,1500,.07)}${TK.rays(1740,80,GRN,12,1500,.06)}
 <rect x="130" y="40" width="100" height="64" rx="20" fill="${RED}" stroke="${K}" stroke-width="8"/><rect x="1690" y="40" width="100" height="64" rx="20" fill="${GRN}" stroke="${K}" stroke-width="8"/>
 <rect y="900" width="1920" height="180" fill="#030805"/>
 ${crowd}
 ${TK.rim(face,'#FF5A5A',34)}
 ${TK.text(960,210,"DON'T RUN",{size:200,fill:'#fff',anchor:'middle',rot:-2,depth:16})}
`,'#06110A');
</script></body></html>
